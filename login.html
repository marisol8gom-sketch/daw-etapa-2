<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Mega Oferta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="auth-page">
<div class="container py-5">
  <div class="auth-card mx-auto">
    <a href="index.html" class="brand-link">← Volver al catálogo</a>
    <div class="text-center mb-4">
      <div class="brand-mark">MO</div>
      <h1 class="h3 fw-bold">Iniciar sesión</h1>
      <p class="text-secondary">Accede a tu cuenta de Mega Oferta.</p>
    </div>
    <div id="loginMessage"></div>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input class="form-control" id="email" type="email" required>
        <div class="invalid-feedback">Ingresa un correo válido.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input class="form-control" id="password" type="password" required minlength="6">
        <div class="invalid-feedback">La contraseña es obligatoria.</div>
      </div>
      <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
    </form>
    <p class="text-center mt-4 mb-0">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
    <div class="demo-box mt-4">
      <strong>Cuenta de demostración</strong><br>
      admin@megaoferta.com / Admin123
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
