<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos | Mega Oferta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<nav class="navbar navbar-dark app-navbar"><div class="container"><a class="navbar-brand fw-bold" href="dashboard.html">Administración</a><a class="btn btn-outline-light btn-sm" href="dashboard.html">Dashboard</a></div></nav>
<main class="container py-5">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4">
    <div><span class="eyebrow">ADMINISTRACIÓN</span><h1 class="fw-bold mb-1">Productos</h1><p class="text-secondary mb-0">Crear, listar, actualizar y eliminar registros.</p></div>
    <button class="btn btn-primary" onclick="openProductForm()">+ Nuevo producto</button>
  </div>
  <div id="productAdminMessage"></div>
  <div id="productFormCard" class="card-soft p-4 mb-4 d-none">
    <h5 id="formTitle" class="fw-bold">Nuevo producto</h5>
    <form id="productForm" class="row g-3" novalidate>
      <input type="hidden" id="productId">
      <div class="col-md-6"><label class="form-label">Nombre</label><input id="pName" class="form-control" required><div class="invalid-feedback">Ingresa el nombre.</div></div>
      <div class="col-md-6"><label class="form-label">Categoría</label><select id="pCategory" class="form-select" required><option value="">Selecciona</option><option>Salas</option><option>Camas</option><option>Comedores</option><option>Roperos</option><option>Colchones</option></select><div class="invalid-feedback">Selecciona una categoría.</div></div>
      <div class="col-md-6"><label class="form-label">Precio</label><input id="pPrice" class="form-control" type="number" min="0.01" step="0.01" required><div class="invalid-feedback">Ingresa un precio válido.</div></div>
      <div class="col-md-6"><label class="form-label">Stock</label><input id="pStock" class="form-control" type="number" min="0" step="1" required><div class="invalid-feedback">Ingresa un stock válido.</div></div>
      <div class="col-12"><label class="form-label">URL de imagen (opcional)</label><input id="pImage" class="form-control" type="url" placeholder="https://..."></div>
      <div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar</button><button class="btn btn-outline-secondary" type="button" onclick="closeProductForm()">Cancelar</button></div>
    </form>
  </div>
  <div class="card-soft p-3"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead><tbody id="productsTable"></tbody></table></div></div>
</main>
<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
