<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro | Mega Oferta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="auth-page">
<div class="container py-5">
  <div class="auth-card mx-auto">
    <a href="index.html" class="brand-link">← Volver al catálogo</a>
    <div class="text-center mb-4">
      <div class="brand-mark">MO</div>
      <h1 class="h3 fw-bold">Crear cuenta</h1>
      <p class="text-secondary">Regístrate como cliente.</p>
    </div>
    <div id="registerMessage"></div>
    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Nombre completo</label>
        <input class="form-control" id="name" required minlength="3">
        <div class="invalid-feedback">Ingresa tu nombre completo.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input class="form-control" id="email" type="email" required>
        <div class="invalid-feedback">Ingresa un correo válido.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input class="form-control" id="password" type="password" required minlength="6">
        <div class="invalid-feedback">Usa al menos 6 caracteres.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirmar contraseña</label>
        <input class="form-control" id="confirmPassword" type="password" required minlength="6">
        <div class="invalid-feedback">Las contraseñas deben coincidir.</div>
      </div>
      <button class="btn btn-primary w-100" type="submit">Crear cuenta</button>
    </form>
    <p class="text-center mt-4 mb-0">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
